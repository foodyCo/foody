name: foody

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .environments/postgres_env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # image + build вместе: локально `compose build` собирает под этим именем,
    # сервер делает только pull. Тег приходит из infra/.env (пишет deploy.sh).
    image: ghcr.io/petrushaa/foodymvp-backend:${IMAGE_TAG:-latest}
    build: ../backend
    restart: unless-stopped
    env_file:
      - .environments/backend_env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    # Волюма с кодом здесь нет намеренно: прод работает из образа.
    # Для локальной разработки волюм живёт в docker-compose.override.yml (не в git).
    volumes:
      - django_static:/app/static
      - django_media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/petrushaa/foodymvp-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    env_file:
      - .environments/frontend_env
    healthcheck:
      # для rolling-подмены; node с fetch — в образе нет curl/wget
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

  celery_worker:
    image: ghcr.io/petrushaa/foodymvp-backend:${IMAGE_TAG:-latest}
    build: ../backend
    command: celery -A config worker -l info
    env_file:
      - .environments/celery_env
    depends_on:
      # backend healthy = миграции накачены; celery не стартует на старой схеме
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    image: ghcr.io/petrushaa/foodymvp-backend:${IMAGE_TAG:-latest}
    build: ../backend
    command: celery -A config beat -l info
    env_file:
      - .environments/celery_env
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - django_static:/var/www/static:ro
      - django_media:/var/www/media:ro
    env_file:
      - .environments/caddy_env
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
    name: foody_postgres_data
  django_static:
    name: foody_django_static
  django_media:
    name: foody_django_media
  caddy_data:
    name: foody_caddy_data
  caddy_config:
    name: foody_caddy_config
