name: foody

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: foody/backend:dev
    build: ../backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    volumes:
      - ../backend:/app
      - django_static:/app/static
      - django_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: foody/frontend:dev
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend

  celery_worker:
    image: foody/backend:dev
    build: ../backend
    command: celery -A config worker -l info
    env_file:
      - .env
    volumes:
      - ../backend:/app
    depends_on:
      - db
      - redis

  celery_beat:
    image: foody/backend:dev
    build: ../backend
    command: celery -A config beat -l info
    env_file:
      - .env
    volumes:
      - ../backend:/app
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template
      - django_static:/var/www/static
      - django_media:/var/www/media
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
    name: foody_postgres_data
  django_static:
    name: foody_django_static
  django_media:
    name: foody_django_media
