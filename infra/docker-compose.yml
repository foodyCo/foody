name: foody

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: foody/backend:dev
    build: ../backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    volumes:
      - ../backend:/app
      - django_static:/app/static
      - django_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: foody/frontend:dev
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend

  celery_worker:
    image: foody/backend:dev
    build: ../backend
    command: celery -A config worker -l info
    env_file:
      - .env
    volumes:
      - ../backend:/app
    depends_on:
      - db
      - redis

  celery_beat:
    image: foody/backend:dev
    build: ../backend
    command: celery -A config beat -l info
    env_file:
      - .env
    volumes:
      - ../backend:/app
    depends_on:
      - db
      - redis

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - django_static:/var/www/static:ro
      - django_media:/var/www/media:ro
    env_file:
      - .env
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
    name: foody_postgres_data
  django_static:
    name: foody_django_static
  django_media:
    name: foody_django_media
  caddy_data:
    name: foody_caddy_data
  caddy_config:
    name: foody_caddy_config
